[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omnitag"
version = "0.0.1"
description = "OmniTag RFID — a multi-vendor RFID reader layer (one interface for every reader), built on llrpkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kyronfeast" }]
keywords = ["rfid", "rain-rfid", "llrp", "impinj", "reader", "asyncio", "multi-vendor"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = [
  "llrpkit>=0.2.0",
]

[project.optional-dependencies]
wyuan = [
  "pyserial>=3.5",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.15",
  "build>=1.2",
  "twine>=5",
]
docs = [
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/kyronfeast/omnitag"
Repository = "https://github.com/kyronfeast/omnitag"
Changelog = "https://github.com/kyronfeast/omnitag/blob/main/CHANGELOG.md"
Issues = "https://github.com/kyronfeast/omnitag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
